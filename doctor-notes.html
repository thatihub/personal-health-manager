<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Doctor Notes | Personal Health Manager</title>
  <link rel="stylesheet" href="./static/css/theme.css" />
  <script src="./static/js/app.js"></script>
  
</head>
<body class="edit-mode" data-page="doctor-notes">
  <main class="wrap">
    <section class="clean-note" aria-label="Current doctor note">
      <header class="clean-note-head">
        <a class="clean-home" href="./index.html">Home</a>
        <div>
          <h1 id="clean-title">Doctor Note</h1>
          <div id="clean-meta" class="clean-meta"></div>
        </div>
        <button id="edit-note" class="clean-edit" type="button">Edit</button>
      </header>
      <div id="clean-content" class="clean-content"></div>
    </section>

    <header class="hero">
      <div>
        <h1>Doctor Notes</h1>
        <div class="sub">Keep one visit note ready, then archive it when the appointment is complete.</div>
      </div>
      <div id="status" class="status" role="status" aria-live="polite">Loading notes…</div>
    </header>

    <section class="layout">
      <article class="card">
        <h2>Current note</h2>
        <div class="form-grid">
          <label>Doctor
            <input id="doctor" autocomplete="off" placeholder="Dr. name" />
          </label>
          <label>Appointment date
            <input id="appointment-date" type="date" />
          </label>
          <label class="wide">Title
            <input id="title" autocomplete="off" placeholder="Purpose of visit" />
          </label>
          <label class="wide">Note
            <textarea id="content" placeholder="Paste your doctor note here…"></textarea>
          </label>
        </div>
        <div class="toolbar">
          <button id="save" class="primary" type="button">Save note</button>
          <button id="copy" type="button">Copy</button>
          <button id="print" type="button">Print</button>
          <button id="archive" class="archive" type="button">Archive &amp; start new</button>
          <button id="clear" class="danger" type="button">Clear draft</button>
        </div>
      </article>

      <aside class="card archive-panel">
        <div class="side-head">
          <h2>Archive</h2>
          <span id="count" class="count">0 notes</span>
        </div>
        <input id="search" type="search" placeholder="Search doctor, date, or note…" aria-label="Search archived notes" />
        <div id="archive-list" class="archive-list"></div>
      </aside>
    </section>
    <section id="print-view" class="print-view" aria-hidden="true">
      <h1 id="print-title"></h1>
      <div id="print-meta" class="print-meta"></div>
      <div id="print-content" class="print-content"></div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const fields = { doctor: $("doctor"), appointment_date: $("appointment-date"), title: $("title"), content: $("content") };
    let store = { current: null, archived: [] };
    let dirty = false;
    let selectedPrintNote = null;

    function id() {
      return (crypto.randomUUID && crypto.randomUUID()) || `note-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }
    function setStatus(message, error = false) {
      $("status").textContent = message;
      $("status").style.color = error ? "#ffb4a8" : "#a9e9c9";
    }
    function readForm() {
      return {
        id: store.current?.id || id(),
        doctor: fields.doctor.value.trim(),
        appointment_date: fields.appointment_date.value,
        title: fields.title.value.trim(),
        content: fields.content.value.trim(),
        updated_at: new Date().toISOString()
      };
    }
    function fillForm(note) {
      Object.entries(fields).forEach(([key, input]) => input.value = note?.[key] || "");
      dirty = false;
    }
    function showView(note = store.current) {
      if (!hasContent(note)) return showEdit();
      $("clean-title").textContent = note.title || "Doctor Note";
      $("clean-meta").textContent = [note.doctor, note.appointment_date].filter(Boolean).join(" · ");
      renderCleanContent(note.content || "");
      document.body.classList.remove("edit-mode");
      document.body.classList.add("view-mode");
      window.scrollTo({top:0, behavior:"auto"});
    }
    function renderCleanContent(content) {
      const container = $("clean-content");
      container.replaceChildren();
      const bullets = [];
      const notes = [];
      let currentBullet = null;
      let currentNote = "";
      const stack = [];
      content.split(/\r?\n/).forEach(rawLine => {
        const line = rawLine.trim();
        const match = rawLine.match(/^(\s*)[•\-*]\s+(.+)$/);
        if (match) {
          if (currentNote) {
            notes.push(currentNote);
            currentNote = "";
          }
          const indent = match[1].replace(/\t/g, "    ").length;
          const node = { text: match[2], children: [], indent };
          while (stack.length && stack[stack.length - 1].indent >= indent) stack.pop();
          if (stack.length) stack[stack.length - 1].children.push(node);
          else bullets.push(node);
          stack.push(node);
          currentBullet = node;
        } else if (line && currentBullet) {
          currentBullet.text += ` ${line}`;
        } else if (line) {
          currentNote += `${currentNote ? " " : ""}${line}`;
        } else {
          currentBullet = null;
          if (currentNote) {
            notes.push(currentNote);
            currentNote = "";
          }
        }
      });
      if (currentNote) notes.push(currentNote);
      if (bullets.length) {
        const list = document.createElement("ul");
        list.className = "clean-outline";
        bullets.forEach((node, index) => {
          const topic = topicParts(node.text, index);
          if (node.children.length) topic.keyword = node.text.replace(/\*\*/g, "").replace(/:\s*$/, "").trim();
          const item = document.createElement("li");
          const details = document.createElement("details");
          details.className = "clean-topic";
          const summary = document.createElement("summary");
          summary.textContent = topic.keyword;
          const description = node.children.length ? nestedDetails(node.children) : topicDescription(topic);
          details.append(summary, description);
          item.appendChild(details);
          list.appendChild(item);
        });
        container.appendChild(list);
      }
      notes.forEach(text => {
        const paragraph = document.createElement("p");
        paragraph.className = "clean-closing";
        paragraph.textContent = text;
        container.appendChild(paragraph);
      });
      if (!bullets.length && !notes.length) container.textContent = "No note text.";
    }
    function nestedDetails(nodes, nested = false) {
      const list = document.createElement("ul");
      list.className = nested ? "topic-subdetails" : "topic-tests";
      nodes.forEach(node => {
        const item = document.createElement("li");
        item.textContent = node.text.replace(/\*\*/g, "");
        if (node.children.length) item.appendChild(nestedDetails(node.children, true));
        list.appendChild(item);
      });
      return list;
    }
    function topicDescription(topic) {
      const testLists = {
        "Requested tests": [
          "CMP",
          "Cystatin C/eGFR",
          "First-morning UACR",
          "Urinalysis",
          "Serum osmolality",
          "Urine osmolality",
          "Urine sodium"
        ],
        "Cardiovascular labs": [
          "ApoB",
          "Standard lipid panel",
          "hs-CRP"
        ]
      };
      if (testLists[topic.keyword]) {
        const list = document.createElement("ul");
        list.className = "topic-tests";
        testLists[topic.keyword].forEach(test => {
          const item = document.createElement("li");
          item.textContent = test;
          list.appendChild(item);
        });
        return list;
      }
      const paragraph = document.createElement("p");
      paragraph.className = "topic-description";
      paragraph.textContent = topic.description;
      return paragraph;
    }
    function topicParts(text, index) {
      const clean = text.replace(/\*\*/g, "").trim();
      const labeled = clean.match(/^([^:]{2,55}):\s*(.+)$/);
      if (labeled) return { keyword: labeled[1].trim(), description: labeled[2].trim() };
      const lower = clean.toLowerCase();
      const knownTopics = [
        ["mounjaro", "Mounjaro & kidney impact"],
        ["levothyroxine", "Thyroid medication"],
        ["lp(a)", "Cardiovascular labs"],
        ["fell from a ladder", "Previous fall"],
        ["please consider", "Requested tests"]
      ];
      const match = knownTopics.find(([phrase]) => lower.includes(phrase));
      if (match) return { keyword: match[1], description: clean };
      const firstSentence = clean.split(/[.?!]/, 1)[0].trim();
      const words = firstSentence.split(/\s+/);
      const keyword = words.slice(0, 6).join(" ") + (words.length > 6 ? "…" : "");
      return { keyword: keyword || `Topic ${index + 1}`, description: clean };
    }
    function showEdit() {
      document.body.classList.remove("view-mode");
      document.body.classList.add("edit-mode");
      window.scrollTo({top:0, behavior:"auto"});
    }
    function hasContent(note) {
      return Boolean(note && (note.doctor || note.appointment_date || note.title || note.content));
    }
    async function persist(message = "Saved") {
      const response = await fetch("/api/doctor-notes", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(store)
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(result.error || "Unable to save notes");
      dirty = false;
      setStatus(`${message} · ${new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"})}`);
    }
    async function saveCurrent() {
      store.current = readForm();
      await persist("Note saved");
      showView(store.current);
    }
    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
    }
    function renderArchive() {
      const query = $("search").value.trim().toLowerCase();
      const notes = store.archived
        .filter(n => `${n.doctor} ${n.appointment_date} ${n.title} ${n.content}`.toLowerCase().includes(query))
        .sort((a,b) => (b.archived_at || b.updated_at || "").localeCompare(a.archived_at || a.updated_at || ""));
      $("count").textContent = `${store.archived.length} ${store.archived.length === 1 ? "note" : "notes"}`;
      if (!notes.length) {
        $("archive-list").innerHTML = `<div class="empty">${query ? "No matching notes." : "Archived visit notes will appear here."}</div>`;
        return;
      }
      $("archive-list").innerHTML = notes.map(note => `
        <details class="note">
          <summary>
            <div class="note-title">${escapeHtml(note.title || "Untitled note")}</div>
            <div class="note-meta">${escapeHtml(note.doctor || "No doctor")} · ${escapeHtml(note.appointment_date || "No date")}</div>
          </summary>
          <div class="note-body">
            <div class="preview">${escapeHtml(note.content || "No note text")}</div>
            <div class="note-actions">
              <button data-action="copy" data-id="${escapeHtml(note.id)}">Copy</button>
              <button data-action="print" data-id="${escapeHtml(note.id)}">Print</button>
              <button data-action="restore" data-id="${escapeHtml(note.id)}">Restore</button>
              <button class="danger" data-action="delete" data-id="${escapeHtml(note.id)}">Delete</button>
            </div>
          </div>
        </details>`).join("");
    }
    async function copyText(note) {
      const heading = [note.title, note.doctor, note.appointment_date].filter(Boolean).join("\n");
      await navigator.clipboard.writeText(`${heading}${heading ? "\n\n" : ""}${note.content || ""}`);
      setStatus("Copied to clipboard");
    }
    function printNote(note) {
      selectedPrintNote = note;
      window.print();
    }
    $("save").addEventListener("click", () => saveCurrent().catch(e => setStatus(e.message, true)));
    $("edit-note").addEventListener("click", showEdit);
    $("copy").addEventListener("click", () => copyText(readForm()).catch(() => setStatus("Clipboard access was unavailable", true)));
    $("print").addEventListener("click", () => printNote(readForm()));
    $("archive").addEventListener("click", async () => {
      const note = readForm();
      if (!hasContent(note)) return setStatus("Add something before archiving", true);
      note.archived_at = new Date().toISOString();
      store.archived.unshift(note);
      store.current = null;
      fillForm(null);
      renderArchive();
      showEdit();
      try { await persist("Note archived"); } catch(e) { setStatus(e.message, true); }
    });
    $("clear").addEventListener("click", async () => {
      if (!hasContent(readForm()) || confirm("Clear the current draft? This cannot be undone.")) {
        store.current = null;
        fillForm(null);
        try { await persist("Draft cleared"); } catch(e) { setStatus(e.message, true); }
      }
    });
    $("search").addEventListener("input", renderArchive);
    Object.values(fields).forEach(input => input.addEventListener("input", () => { dirty = true; setStatus("Unsaved changes"); }));
    $("archive-list").addEventListener("click", async (event) => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const note = store.archived.find(n => n.id === button.dataset.id);
      if (!note) return;
      const action = button.dataset.action;
      if (action === "copy") return copyText(note).catch(() => setStatus("Clipboard access was unavailable", true));
      if (action === "print") return printNote(note);
      if (action === "restore") {
        if (hasContent(readForm()) && !confirm("Replace the current draft with this archived note?")) return;
        store.archived = store.archived.filter(n => n.id !== note.id);
        const { archived_at, ...restored } = note;
        store.current = {...restored, updated_at:new Date().toISOString()};
        fillForm(store.current);
        renderArchive();
        return persist("Note restored").then(() => showView(store.current)).catch(e => setStatus(e.message, true));
      }
      if (action === "delete" && confirm(`Delete “${note.title || "Untitled note"}” permanently?`)) {
        store.archived = store.archived.filter(n => n.id !== note.id);
        renderArchive();
        return persist("Archived note deleted").catch(e => setStatus(e.message, true));
      }
    });
    window.addEventListener("beforeunload", event => { if (dirty) { event.preventDefault(); event.returnValue = ""; } });
    window.addEventListener("beforeprint", () => {
      const note = selectedPrintNote || readForm();
      $("print-title").textContent = note.title || "Doctor Note";
      $("print-meta").textContent = [note.doctor, note.appointment_date].filter(Boolean).join(" · ");
      $("print-content").textContent = note.content || "";
    });
    window.addEventListener("afterprint", () => { selectedPrintNote = null; });

    async function loadDoctorNotes() {
      const urls = [
        "/api/doctor-notes",
        "https://personal-health-manager-5fo7.onrender.com/api/doctor-notes"
      ];
      let lastError = new Error("Unable to load notes");
      for (const url of urls) {
        try {
          const response = await fetch(url, {cache:"no-store"});
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || "Unable to load notes");
          return result;
        } catch (error) {
          lastError = error;
        }
      }
      throw lastError;
    }

    loadDoctorNotes()
      .then(result => {
        store = {current:result.current || null, archived:Array.isArray(result.archived) ? result.archived : []};
        fillForm(store.current);
        renderArchive();
        setStatus(store.current?.updated_at ? `Last saved ${new Date(store.current.updated_at).toLocaleString()}` : "Ready for a new note");
        if (hasContent(store.current)) showView(store.current);
      })
      .catch(error => setStatus(error.message, true));
  </script>
  <script src="./static/js/shell.js"></script>
</body>
</html>

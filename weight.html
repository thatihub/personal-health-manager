<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Weight</title><link rel="stylesheet" href="./static/css/theme.css" />
  <script src="./static/js/app.js"></script>
</head>
<body data-page="weight"><main class="wrap"><h1>Daily Weight</h1><p>One measurement per local calendar day. Dates and times stay as you enter them.</p>
<section class="card"><h2 id="form-title">New entry</h2><form id="weight-form"><label>Local date and time<input id="measured-at" type="datetime-local" required></label><label>Weight (lb)<input id="weight" type="number" min="0.01" step="any" required></label><button id="save">Save entry</button> <button id="cancel" type="button">New entry / Cancel edit</button></form><p id="message" role="status" aria-live="polite"></p></section>
<section class="card"><h2>Current health context</h2><div id="weight-context">Loading…</div></section>
<section class="card"><h2>Daily history</h2><div class="table-wrap"><table><thead><tr><th>Local date and time</th><th>Weight (lb)</th><th>Action</th></tr></thead><tbody id="entries"></tbody></table></div></section></main><script src="weight_context.js"></script><script src="weight.js"></script><script src="storage_status.js"></script>  <script src="./static/js/shell.js"></script>
</body></html>

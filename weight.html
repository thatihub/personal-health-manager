<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Weight</title><link rel="stylesheet" href="companion_theme.css">
<style>body{font:16px system-ui;background:#101e2b;color:#e7f1fa;margin:0}main{max-width:960px;margin:32px auto;padding:20px}a{color:#7dd9ff}section{background:#192c3b;padding:24px;border-radius:16px;margin:20px 0}label{display:inline-flex;flex-direction:column;gap:8px;margin:8px 16px 12px 0}input,button{font:inherit;padding:10px;border-radius:6px}button{cursor:pointer}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #476071}.scroll{overflow:auto}#message{min-height:24px}</style></head>
<body><main><a href="index.html">Home</a> · <a href="composition.html">Body Composition</a> · <a href="bio-age.html">Biological Age</a><h1>Daily Weight</h1><p>One measurement per local calendar day. Dates and times stay as you enter them.</p>
<section><h2 id="form-title">New entry</h2><form id="weight-form"><label>Local date and time<input id="measured-at" type="datetime-local" required></label><label>Weight (lb)<input id="weight" type="number" min="0.01" step="any" required></label><button id="save">Save entry</button> <button id="cancel" type="button">New entry / Cancel edit</button></form><p id="message" role="status" aria-live="polite"></p></section>
<section><h2>Current health context</h2><div id="weight-context">Loading…</div></section>
<section><h2>Daily history</h2><div class="scroll"><table><thead><tr><th>Local date and time</th><th>Weight (lb)</th><th>Action</th></tr></thead><tbody id="entries"></tbody></table></div></section></main><script src="weight_context.js"></script><script src="weight.js"></script></body></html>

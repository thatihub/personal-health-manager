<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Cabinet</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif;
      background: linear-gradient(160deg, #0b1219 0%, #101923 44%, #121b1a 100%);
      color: #e7edf3;
      padding: 18px;
    }
    .wrap { max-width: 1240px; margin: 0 auto; }
    .nav { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
    .nav a {
      text-decoration:none; padding:9px 12px; border-radius:12px;
      border:1px solid rgba(164,185,204,.2); background:rgba(17,26,36,.92);
      color:#d5e2ee; font-weight:700; font-size:13px; min-height:44px; display:inline-flex; align-items:center;
    }
    .nav a.active { background:linear-gradient(120deg,#0f7ea6,#1a93bf); color:#fff; border-color:transparent; }
    h1 { margin:0 0 6px; font-family: Georgia, "Times New Roman", serif; }
    .sub { color:#aab8c6; margin-bottom:10px; }
    .search {
      width: min(540px, 100%);
      min-height: 44px;
      border-radius: 12px;
      border: 1px solid #3a556e;
      background: #13202d;
      color: #e9f2fb;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 14px;
    }
    .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:12px; }
    .card {
      border: 1px solid #2b4155;
      border-radius: 14px;
      background: #101a25;
      padding: 12px;
    }
    .card h3 { margin: 0 0 8px; color: #f1f7fd; }
    .item {
      border-top: 1px solid #223546;
      padding: 8px 0;
    }
    .item:first-child { border-top: 0; padding-top: 0; }
    .k { color:#9cb2c6; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; }
    .v { color:#e7f0f8; font-weight: 700; }
    .muted { color:#aab8c6; font-size: 12px; margin-top: 2px; }
    a.link { color:#8fc8e5; text-decoration: none; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="nav">
      <a href="./index.html">Home</a>
      <a href="./dashboard.html">Lab Results Dashboard</a>
      <a href="./bp.html">Blood Pressure</a>
      <a href="./vault.html">Health Vault</a>
      <a href="./admin.html">Admin</a>
      <a class="active" href="./cabinet.html">Cabinet</a>
      <a href="./history.html">History</a>
    </nav>
    <h1 id="title">Project Cabinet</h1>
    <div class="sub" id="subtitle">Organized place for health documents, references, and quick links.</div>
    <input id="q" class="search" type="search" placeholder="Search section, document, or keyword..." />
    <section class="grid" id="root"></section>
  </div>

  <script>
    async function loadCabinet() {
      const root = document.getElementById("root");
      const q = document.getElementById("q");
      const title = document.getElementById("title");
      const subtitle = document.getElementById("subtitle");
      let data;
      try {
        const res = await fetch("./cabinet_data.json");
        data = await res.json();
      } catch (_e) {
        root.innerHTML = '<div class="card">Failed to load cabinet data.</div>';
        return;
      }

      title.textContent = data.title || "Project Cabinet";
      subtitle.textContent = data.subtitle || "";
      const sections = Array.isArray(data.sections) ? data.sections : [];

      function render(filterText) {
        const ft = (filterText || "").trim().toLowerCase();
        root.innerHTML = sections.map((s) => {
          const items = Array.isArray(s.items) ? s.items : [];
          const filtered = items.filter((it) => {
            const blob = `${s.name || ""} ${it.title || ""} ${it.note || ""} ${it.type || ""}`.toLowerCase();
            return !ft || blob.includes(ft);
          });
          if (!filtered.length) return "";
          return `
            <article class="card">
              <h3>${s.name || "Section"}</h3>
              ${filtered.map((it) => `
                <div class="item">
                  <div class="k">${it.type || "item"}</div>
                  <div class="v">${it.href ? `<a class="link" href="${it.href}">${it.title || "-"}</a>` : (it.title || "-")}</div>
                  ${it.note ? `<div class="muted">${it.note}</div>` : ""}
                </div>
              `).join("")}
            </article>
          `;
        }).join("");
      }

      q.addEventListener("input", () => render(q.value));
      render("");
    }

    loadCabinet();
  </script>
</body>
</html>

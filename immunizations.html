<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Immunizations</title>
  
  <link rel="stylesheet" href="./static/css/theme.css" />
  <script src="./static/js/app.js"></script>
</head>
<body data-page="immunizations">
  <div class="wrap">
    

    <h1>Immunizations</h1>
    <div class="sub">Latest vaccines on file with dates and product names.</div>
    <div class="search-wrap">
      <input id="imm-search" class="search-input" type="search" placeholder="Search vaccine or date..." />
    </div>

    <section class="grid" id="imm-grid"></section>
  </div>

  <script>
    const IMM_DATA = [
      { title: "COVID-19 Moderna (External Administration)", dates: ["10/31/2021", "04/24/2021", "03/29/2021"], tag: "COVID-19" },
      { title: "Shingrix dose 1", dates: ["03/07/2025"], tag: "Shingles" },
      { title: "Shingrix dose 2", dates: ["08/28/2024"], tag: "Shingles" },
      { title: "PCV (status to confirm)", dates: [], tag: "Pneumococcal" },
      { title: "RSV (status to confirm)", dates: [], tag: "RSV" },
      { title: "Tetanus (every 10 years)", dates: [], tag: "Tetanus/Diphtheria" },
      { title: "PPSV23 (Pneumococcal polysaccharide)", dates: ["08/08/2019", "05/23/2000"], tag: "Pneumococcal" },
      { title: "TD pres free (Tetanus, Diphtheria) (Tenivac), adsorbed", dates: ["11/27/2018"], tag: "Tetanus/Diphtheria" },
      { title: "Tdap (ADACEL) (Tetanus, diphtheria, acellular pertussis)", dates: ["08/26/2008"], tag: "Tdap" },
      { title: "INFs (Influenza split virus)", dates: ["10/18/2013", "11/17/2007", "11/11/2006", "11/02/2005", "11/06/2002", "11/13/2001", "11/18/2000", "10/12/1999"], tag: "Influenza" },
      { title: "INFs (Quadrivalent) (Influenza)", dates: ["09/20/2019"], tag: "Influenza" },
      { title: "INFs 4yrs and over (FLUVIRIN) (Influenza)", dates: ["10/16/2017", "10/20/2015"], tag: "Influenza" },
      { title: "INFs 4yrs-adult (influenza)", dates: ["10/16/2009"], tag: "Influenza" },
      { title: "INFS Pres Free 18yrs-adult (Flublok quadrivalent) recomb (influenza)", dates: ["09/27/2018"], tag: "Influenza" },
      { title: "INFs pres free 18yrs-adult (influenza)", dates: ["11/01/2008"], tag: "Influenza" },
      { title: "INFs pres free 3yrs-adult (Influenza)", dates: ["11/01/2014", "09/19/2012", "10/15/2011"], tag: "Influenza" },
      { title: "INFS pres free 6mos-adult (Fluarix quadrivalent) (influenza)", dates: ["10/12/2022"], tag: "Influenza" },
      { title: "INFS pres free 6mos-adult (quadrivalent) (influenza)", dates: ["10/24/2021", "09/18/2020"], tag: "Influenza" },
      { title: "INFs pres free 9yrs-adult (AFLURIA) (Influenza)", dates: ["10/06/2016"], tag: "Influenza" }
    ];

    const CORE_DATA = IMM_DATA.filter((v) => v.tag !== "Influenza");
    const FLU_DATA = IMM_DATA.filter((v) => v.tag === "Influenza");

    function render(data) {
      const grid = document.getElementById("imm-grid");
      grid.innerHTML = data.map((v) => `
        <article class="card">
          <div class="tag">${v.tag || "Vaccine"}</div>
          <h3>${v.title}</h3>
          <div class="muted">Dates on file:</div>
          <div class="dates">${v.dates.join(", ")}</div>
        </article>
      `).join("");
    }

    function bindSearch() {
      const input = document.getElementById("imm-search");
      input.addEventListener("input", () => {
        const q = input.value.trim().toLowerCase();
        const filtered = CORE_DATA.filter((v) =>
          v.title.toLowerCase().includes(q) ||
          v.tag.toLowerCase().includes(q) ||
          v.dates.some((d) => d.toLowerCase().includes(q))
        );
        render(filtered);
      });
    }

    render(CORE_DATA);
    bindSearch();

    // Render flu history in collapsible panel
    (function renderFlu() {
      if (!FLU_DATA.length) return;
      const panel = document.createElement("details");
      panel.className = "card";
      panel.style.marginTop = "12px";
      panel.open = false;
      panel.innerHTML = `
        <summary style="cursor:pointer;font-weight:800;color:#c9bbff;">Influenza history (expand to view)</summary>
        <div style="margin-top:8px;">${FLU_DATA.map((v) => `
          <div style="border-top:1px solid rgba(116,144,172,0.34); padding:8px 0;">
            <div class="tag">Influenza</div>
            <h3 style="margin:0 0 4px; font-size:16px; color:#f0f4ff;">${v.title}</h3>
            <div class="muted">Dates on file:</div>
            <div class="dates">${v.dates.join(", ")}</div>
          </div>
        `).join("")}</div>
      `;
      document.querySelector(".wrap").appendChild(panel);
    })();
  </script>
  <script src="./static/js/shell.js"></script>
</body>
</html>
